[package]
name = "cubitshell"
description = "Servo embedded on CuBit: SWGL rendering into a CuBit surface."
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true

[[bin]]
name = "cubitshell"
path = "src/main.rs"
bench = false

[features]
default = ["harfrust"]
# Shaping (WEB-004): HarfRust (Rust) is Penny's shaper. `harfbuzz` alone
# builds the previous, C++ shaper for A/B comparisons; both together let the
# shaping-backend flag pick one or compare them (hosted diagnostics).
harfrust = ["servo/harfrust"]
harfbuzz = ["servo/harfbuzz"]
bundled = ["servo/bundled"]
media = ["servo/media-gstreamer", "dep:gstreamer"]

[dependencies]
dpi = { workspace = true }
gleam = { workspace = true }
glow = { workspace = true }
log = { workspace = true }
# Web Crypto (window.crypto: getRandomValues, randomUUID, subtle) is one of
# Servo's default web features; sites such as GitHub need it.
servo = { workspace = true, features = ["webcrypto"] }
surfman = { workspace = true }
swgl = "0.70"
url = { workspace = true }
# Penny's cryptography (WEB-004), hosted and on CuBit.
penny-crypto = { workspace = true }

[target.'cfg(target_os = "cubit")'.dependencies]
# Expanded by patch_servo.py for the selected Servo checkout. Use the same
# rasterizer with Servo's Rust runtime, not a second no_std allocator/panic ABI.
servo-base = { workspace = true }
profile_traits = { workspace = true }
gstreamer = { workspace = true, optional = true }
time = { workspace = true }
cubit-fonts = { path = "../../cubit-build/fonts" }
# The font list's status (no usable face is a visible error, never blank text).
fonts = { workspace = true }
